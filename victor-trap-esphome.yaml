# =============================================================================
# Victor Smart-Kill -> local ESPHome   *** PRODUCTION ***
#
# Wake sources:
#   - timer (deep-sleep)  -> "Deep-Sleep Wake"   -> routine report
#   - catch (plates short pulls RST via Schmitt) -> "External System" -> kill cycle
#   - power-on (battery inserted)                -> "Power On"         -> clears "needs cleaning"
#
# Flow each wake:
#   boot -> GPIO0 high -> (fresh boot + no short? clear needs_cleaning) ->
#   sample battery (GPIO0 pulsed low 300ms) ->
#   if catch: red, count++, needs_cleaning=true, ALWAYS-LIVE 10s static HV, green re-confirm ->
#   wait for HA API (<= api_timeout): connected -> report 15s -> sleep 6h
#                                     not connected          -> sleep 10min (retry)
#   (sleep is blocked while "Stay awake" is on, or while a walk-by indicator is active)
#
# Pins: GPIO12 catch(active-LOW) | GPIO2 + GPIO13 HV PWM | GPIO0 batt-divider enable(LOW)
#       GPIO5 blue | GPIO14 red | GPIO15 green | A0 batt | GPIO1/3 used by board (UART off)
# =============================================================================

substitutions:
  node_name: local-kill
  # --- chained heartbeat: one sleep is a short chunk (must stay < ESP8266 ~3.5h limit);
  #     WiFi/report only fires every report_cycles chunks. 2h x 12 = ~24h, like stock. ---
  chunk_sleep: "2h"           # one deep-sleep chunk
  report_cycles: "12"         # bring up WiFi + report every N chunks (12 x 2h = ~24h)
  retry_sleep: "10min"        # sleep if the API never connected on a report wake
  api_timeout: "60s"          # max wait for HA before giving up and retrying
  hv_settle: "100ms"          # brief settle after the boot inrush (was 300ms - the brownout that
                              #   forced 300 was a dead-short bench artifact; a real mouse is a
                              #   resistive load. Shorter settle = less time for the mouse to bolt.)
  hv_duty: "0.284"            # STATIC HV duty @ 230.6 Hz (no battery compensation)
  catch_window_ms: "5000"     # after a wake, watch the plates this long (DARK) and fire the instant
                              #   a mouse bridges them - covers a mouse rummaging / flaky contact

esp8266:
  board: esp01          # AT25SF041 = 512 KB flash (detected). No OTA room at 512K - flash via serial.
  restore_from_flash: true   # persist globals (kill_count, needs_cleaning, wake_count) across deep sleep + power loss

preferences:
  flash_write_interval: 15s  # commit changed globals within 15s so an arm toggle sticks before sleep

esphome:
  name: ${node_name}
  friendly_name: "Local-Kill"
  name_add_mac_suffix: true          # each trap self-names as ${node_name}-<mac> for easy multi-flash
  on_boot:
    priority: -100
    then:
      # --- CATCH LISTEN WINDOW: after a wake, watch the plates for up to ${catch_window_ms} ms,
      #     DARK and radio-off, and break the INSTANT we see a solid (debounced) bridge so the
      #     catch path fires right then. A mouse rummaging in the trap often isn't shorting the
      #     plates at the one millisecond a single snapshot would check - this waits it out.
      #     A bridged plate IS a catch regardless of reset reason (deep-sleep wakes often
      #     mis-label an external/catch reset as "Deep-Sleep Wake").
      #     delay() yields + feeds the watchdog, so the long loop is safe (same as our 10s HV). ---
      - lambda: |-
          bool b = false;
          const int steps = ${catch_window_ms} / 20;
          for (int i = 0; i < steps; i++) {
            if (digitalRead(12) == 0) {               // possible bridge
              delay(5);
              if (digitalRead(12) == 0) { b = true; break; }   // confirmed = stop & fire now
            }
            delay(20);
          }
          id(plates_now) = b;

      # --- chained heartbeat gate ---
      # A timer wake with plates CLEAR and the count not reached = intermediate wake:
      # bump the RTC counter and go straight back to sleep. A bridged plate (a catch)
      # skips this and falls through to fire, even if the reset reason mislabels it.
      - if:
          condition:
            lambda: 'return ESP.getResetReason() == "Deep-Sleep Wake" && (!id(plates_now) || id(needs_cleaning)) && (id(wake_count) + 1) < ${report_cycles};'
          then:
            - lambda: 'id(wake_count) += 1;'
            - logger.log: "intermediate heartbeat wake - back to sleep"
            - deep_sleep.allow: trap_sleep
            - lambda: 'global_preferences->sync();'   # flush globals (wake_count...) before sleep
            - deep_sleep.enter:
                id: trap_sleep
                sleep_duration: ${chunk_sleep}

      # --- full path: report wake (count reached), catch, or power-on ---
      - lambda: 'id(wake_count) = 0;'             # reset the heartbeat cycle
      # brownout detector: if hv_live survived the reset, last boot died MID-HV-FIRE
      - lambda: |-
          id(hv_brownout) = id(hv_live);
          id(hv_live) = false;
          if (id(hv_brownout)) ESP_LOGW("hv", "BROWNOUT: board reset during the last HV fire");
      - lambda: 'global_preferences->sync();'
      - deep_sleep.prevent: trap_sleep            # don't sleep until we decide
      - output.turn_on: gpio0                     # GPIO0 HIGH (clean boot, divider off)
      - output.set_level: { id: hv_pwm, level: 0.0 }
      - output.set_level: { id: hv_pwm2, level: 0.0 }

      # --- classify from the plate read above: bridged = Catch regardless of reset reason ---
      - lambda: |-
          String r = ESP.getResetReason();
          // bridged plate = NEW catch only if there isn't already an uncleaned kill on the
          // plates. needs_cleaning stays set until serviced, so the corpse won't be re-zapped.
          if (id(plates_now) && !id(needs_cleaning)) id(wake_reason) = "Catch";
          else if (r == "Deep-Sleep Wake")  id(wake_reason) = "Scheduled";
          else if (r == "Power On")         id(wake_reason) = "Power on";
          else if (r == "External System")  id(wake_reason) = "Button";
          else                              id(wake_reason) = std::string(r.c_str());

      # --- CATCH: fire HV AS FAST AS POSSIBLE (before battery sample / breathe / report) ---
      - if:
          condition:
            lambda: 'return id(wake_reason) == std::string("Catch");'
          then:
            - delay: ${hv_settle}                 # brief rail settle after the boot inrush
            - logger.log: "CATCH - firing HV 10s (always live), dark"
            # Fire in the DARK - NO LED before or during the fire. A mouse bolts at the first
            # light/motion and breaks contact; the red LED only flashes AFTER, to confirm a body.
            # mark HV live in flash; if the board resets mid-fire this flag survives = brownout proof
            - lambda: 'id(hv_live) = true; global_preferences->sync();'
            # Fire FULL duty immediately - hardest, fastest hit so the mouse can't react.
            # (rail is already stabilized by the hv_settle delay above; brownout detector
            #  stays on - if a real kill ever trips it, reconsider a ramp or lower duty)
            - output.set_level:
                id: hv_pwm
                level: ${hv_duty}
            - output.set_level:
                id: hv_pwm2
                level: ${hv_duty}
            - delay: 10s
            - output.set_level:
                id: hv_pwm
                level: 0.0
            - output.set_level:
                id: hv_pwm2
                level: 0.0
            - lambda: 'id(hv_live) = false; global_preferences->sync();'   # fire completed cleanly
            # confirm AFTER the shock (like the stock): a body still across the plates = real kill.
            # Only now do we count it and flag cleaning - a glancing contact that left isn't counted.
            - delay: 200ms                        # let the sense settle after HV
            - if:
                condition:
                  lambda: 'return digitalRead(12) == 0;'   # still shorted = body present
                then:
                  - logger.log: "confirmed kill - body on plates"
                  - lambda: 'id(kill_count) += 1; id(needs_cleaning) = true; global_preferences->sync();'
                  - component.update: kill_total
                  - repeat:
                      count: 5
                      then:
                        - output.turn_on: led_catch
                        - delay: 150ms
                        - output.turn_off: led_catch
                        - delay: 150ms
                else:
                  - logger.log: "plates clear after shock - fired but not counted"

      # --- now the non-urgent stuff ---
      - component.update: wake_reason_s
      - light.turn_on:                            # green breathes while awake/reporting
          id: led_status
          effect: "Breathe"

      # --- SERVICE / RE-ARM: a human wake (power-on OR the trap's Wi-Fi button) with the
      #     plates CLEAR means the trap was emptied -> clear the needs-cleaning lockout.
      #     (A timer wake with clear plates does NOT clear it, so re-arm stays manual;
      #      plates still bridged = body present -> never clears.) ---
      - if:
          condition:
            lambda: |-
              String r = ESP.getResetReason();
              return (r == "Power On" || r == "External System") && !id(plates_now);
          then:
            - lambda: 'id(needs_cleaning) = false; global_preferences->sync();'
            - logger.log: "serviced (power-on/button, plates clear) - needs_cleaning cleared & re-armed"

      # --- battery: ONE sample per wake (GPIO0 low -> settle -> read -> GPIO0 high) ---
      - output.turn_off: gpio0                    # divider ON
      - delay: 250ms
      - component.update: batt_v
      - delay: 50ms
      - output.turn_on: gpio0                     # divider OFF (save power)
      - component.update: batt_pct

      # --- API watchdog: wait up to api_timeout; if HA never connects, short-sleep & retry ---
      - delay: ${api_timeout}
      - if:
          condition:
            not:
              api.connected:
          then:
            - logger.log: "no API this wake - sleeping ${retry_sleep} to retry"
            - if:
                condition:
                  lambda: 'return !id(stay_awake) && !(id(walkby) && id(needs_cleaning));'
                then:
                  - deep_sleep.allow: trap_sleep
                  - lambda: 'global_preferences->sync();'   # flush globals before sleep
                  - deep_sleep.enter:
                      id: trap_sleep
                      sleep_duration: ${retry_sleep}

globals:
  - id: kill_count
    type: int
    restore_value: true
    initial_value: '0'
  - id: needs_cleaning
    type: bool
    restore_value: true          # survives sleep; cleared on fresh boot w/ no short
    initial_value: 'false'
  - id: stay_awake
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: walkby
    type: bool
    restore_value: true          # "Walk-by red indicator" switch state
    initial_value: 'false'
  - id: wake_count
    type: int
    restore_value: true          # RTC-backed heartbeat chunk counter (survives deep sleep)
    initial_value: '0'
  - id: wake_reason
    type: std::string
    restore_value: false         # friendly label for why this wake happened
    initial_value: '""'
  - id: hv_live
    type: bool
    restore_value: true          # flashed true during an HV fire; survives a reset = brownout proof
    initial_value: 'false'
  - id: hv_brownout
    type: bool
    restore_value: false         # this-boot flag: last reset happened mid-HV-fire
    initial_value: 'false'
  - id: plates_now
    type: bool
    restore_value: false         # this-boot: plates bridged at wake (= catch, any reset reason)
    initial_value: 'false'

logger:
  baud_rate: 0                   # UART off - GPIO1/3 are used by the trap hardware

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true          # skip the full scan - faster join = shorter wake = less battery
  ap:
    ssid: "${node_name}-setup"
    password: !secret ap_password
captive_portal:

api:
  encryption:
    key: !secret api_key
  on_client_connected:
    - light.turn_on:                  # solid green once HA is connected (stop the breathe)
        id: led_status
        brightness: 100%
        effect: "None"
    - delay: 15s                        # let HA pull battery / kill total, then sleep
    - if:
        condition:
          lambda: 'return !id(stay_awake) && !(id(walkby) && id(needs_cleaning));'
        then:
          - logger.log: "HA reported - sleeping one chunk"
          - deep_sleep.allow: trap_sleep
          - lambda: 'global_preferences->sync();'   # flush globals (kill_count...) before sleep
          - deep_sleep.enter:
              id: trap_sleep
              sleep_duration: ${chunk_sleep}
        else:
          - logger.log: "staying awake (Stay awake, or walk-by indicator active)"

# No OTA: 512 KB flash has no room to stage a second image. Flash via USB-serial.

# ------------- Inputs -------------
binary_sensor:
  - platform: gpio
    name: "Plates bridged"
    pin: { number: GPIO12, inverted: true, mode: { input: true } }   # ON = plates shorted
  - platform: template
    name: "Needs cleaning"
    device_class: problem
    lambda: 'return id(needs_cleaning);'
  - platform: template
    name: "HV brownout last cycle"  # ON = board reset mid-HV-fire (supply couldn't hold the pulse)
    device_class: problem
    entity_category: diagnostic
    lambda: 'return id(hv_brownout);'
  - platform: status
    name: "Status"                 # connectivity: online while connected to HA

# ------------- Sensors -------------
sensor:
  - platform: adc
    pin: A0
    id: batt_v
    name: "Battery voltage"
    update_interval: never            # sampled once per wake during the GPIO0-low pulse
    filters:
      - multiply: 6.44                # one-point cal (5.48 read vs 5.54 actual)
    unit_of_measurement: "V"
    accuracy_decimals: 2
  - platform: template
    name: "Battery %"
    id: batt_pct
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      const float VFULL = 6.40, VEMPTY = 4.60;
      float pct = (id(batt_v).state - VEMPTY) / (VFULL - VEMPTY) * 100.0;
      float clamped = pct < 0 ? 0 : (pct > 100 ? 100 : pct);
      return roundf(clamped);   // whole-number state so templates don't see a long float
  - platform: template
    name: "Kill total"
    id: kill_total
    accuracy_decimals: 0
    update_interval: never
    lambda: 'return id(kill_count);'

text_sensor:
  - platform: template
    name: "Wake reason"
    id: wake_reason_s
    entity_category: diagnostic
    update_interval: never
    lambda: 'return {id(wake_reason)};'

# ------------- Outputs -------------
output:
  - platform: esp8266_pwm            # HV drive A -> Q8 -> transformer
    pin: GPIO13
    id: hv_pwm
    frequency: 230.6 Hz
    min_power: 0.0
    max_power: 1.0
  - platform: esp8266_pwm            # HV drive B (needed for full HV)
    pin: GPIO2
    id: hv_pwm2
    frequency: 230.6 Hz
    min_power: 0.0
    max_power: 1.0
  - platform: gpio
    pin: GPIO0
    id: gpio0                        # HIGH normally; pulsed LOW to enable battery divider
  - platform: esp8266_pwm            # green - breathing status while awake
    pin: GPIO15
    id: led_status_pwm
    frequency: 1000 Hz
  - platform: gpio
    pin: GPIO14
    id: led_catch                    # red - catch / needs cleaning
  - platform: gpio
    pin: GPIO5
    id: led_wifi                     # blue (Wi-Fi icon on case) - lit only in AP/setup mode

# green status LED as a dimmable light so it can "breathe" while the trap is awake
light:
  - platform: monochromatic
    name: "Status LED"
    id: led_status
    output: led_status_pwm
    default_transition_length: 0s
    effects:
      - pulse:
          name: "Breathe"
          transition_length: 1500ms
          update_interval: 1500ms
          min_brightness: 5%
          max_brightness: 90%

# ------------- Walk-by indicator: slow red blink while a kill is uncleaned -------------
interval:
  - interval: 3s
    then:
      - if:
          condition:
            lambda: 'return id(walkby) && id(needs_cleaning);'
          then:
            - output.turn_on: led_catch
            - delay: 60ms
            - output.turn_off: led_catch
      # blue LED (Wi-Fi icon) ONLY in fallback AP mode: not connected AND we've been
      # awake long enough that it's a real fallback, not the brief connect window.
      - if:
          condition:
            and:
              - not:
                  wifi.connected:
              - lambda: 'return millis() > 25000;'   # ~AP fallback (normal connect is < 10s)
          then:
            - output.turn_on: led_wifi
          else:
            - output.turn_off: led_wifi

# ------------- Control -------------
switch:
  - platform: template
    name: "Stay awake"               # blocks sleep for bench work
    lambda: 'return id(stay_awake);'
    turn_on_action:
      - lambda: 'id(stay_awake) = true;'
      - deep_sleep.prevent: trap_sleep
    turn_off_action:
      - lambda: 'id(stay_awake) = false;'
      - deep_sleep.allow: trap_sleep
  - platform: template
    name: "Walk-by red indicator"    # ON = stay awake + slow red blink until cleaned
    lambda: 'return id(walkby);'
    turn_on_action:
      - lambda: 'id(walkby) = true;'
    turn_off_action:
      - lambda: 'id(walkby) = false;'
      - output.turn_off: led_catch

button:
  - platform: template
    name: "HV test 3s (CAUTION)"
    on_press:
      - output.set_level:
          id: hv_pwm
          level: ${hv_duty}
      - output.set_level:
          id: hv_pwm2
          level: ${hv_duty}
      - delay: 3s
      - output.set_level:
          id: hv_pwm
          level: 0.0
      - output.set_level:
          id: hv_pwm2
          level: 0.0
  # (no "Mark cleaned" HA button - re-arm physically: empty the trap, then press the
  #  trap's Wi-Fi button or power-cycle it with the plates clear. See the SERVICE block.)

# ------------- Sleep -------------
deep_sleep:
  id: trap_sleep
  # No run_duration/sleep_duration: sleep is driven only by the explicit
  # deep_sleep.enter calls above (6h after a report, 10min on API failure).
