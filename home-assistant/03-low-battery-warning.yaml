# Local-Kill trap - Home Assistant automation. See README.md in this folder.
# Find/replace  local_kill_XXXXXX  with your trap's entity prefix and
# notify.mobile_app_YOUR_PHONE  with your notify service, then paste into
# Settings > Automations > Create > Edit in YAML.
#
# 3. Low battery warning (checked on every check-in, so it repeats ~daily)
#    Firmware: 6.40 V = 100 %, 4.60 V = 0 %.
alias: "Local-Kill: low battery warning"
mode: single
trigger:
  - platform: state
    entity_id: binary_sensor.local_kill_XXXXXX_status
    to: "on"
condition:
  - condition: template
    value_template: >-
      {% set v = states('sensor.local_kill_XXXXXX_battery_voltage') | float(99) %}
      {{ 4.80 <= v < 5.00 }}
action:
  - service: notify.mobile_app_YOUR_PHONE
    data:
      title: "🪫 Trap battery low"
      message: >-
        {{ states('sensor.local_kill_XXXXXX_battery_voltage') }} V
        ({{ states('sensor.local_kill_XXXXXX_battery') }}%). Plan a battery swap.
      data:
        tag: local-kill-battery
        group: local-kill
