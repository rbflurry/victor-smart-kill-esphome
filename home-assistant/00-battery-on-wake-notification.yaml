# Local-Kill trap - Home Assistant automation (multi-trap). See README.md in this folder.
#
# Works for any number of traps. Edit ONLY the list marked  ▼ YOUR TRAPS ▼
# (one line per trap; entity IDs below assume you renamed the devices to
# "Kitchen trap" / "Garage trap" - use your own names).
# Replace notify.mobile_app_YOUR_PHONE with your notify service, then paste into
# Settings > Automations > Create > Edit in YAML.
#
# Battery report every time a trap wakes and checks in.
# Triggers on "Status" (not the voltage) because the battery is sampled once per
# wake - an unchanged reading wouldn't trigger. Intermediate 2 h heartbeat wakes
# don't connect, so expect ~1 report/day per trap plus catches/button/power-on.
alias: "Local-Kill: battery report on wake"
description: "Send battery voltage, % and wake reason when a trap checks in"
mode: parallel
trigger:
  - platform: state
    entity_id:                                   # ▼ YOUR TRAPS ▼
      - binary_sensor.kitchen_trap_status
      - binary_sensor.garage_trap_status
    to: "on"
variables:
  dev: "{{ device_id(trigger.entity_id) }}"
  ents: "{{ device_entities(device_id(trigger.entity_id)) }}"
  trap: "{{ device_attr(device_id(trigger.entity_id), 'name_by_user') or device_attr(device_id(trigger.entity_id), 'name') }}"
action:
  - delay: "00:00:05"          # let fresh battery / wake-reason states arrive
  - variables:
      volt_ent: "{{ ents | select('match', 'sensor\\..*_battery_voltage$') | first | default('') }}"
      pct_ent:  "{{ ents | select('match', 'sensor\\..*_battery$') | first | default('') }}"
      why_ent:  "{{ ents | select('match', 'sensor\\..*_wake_reason$') | first | default('') }}"
      volts: "{{ states(volt_ent) | float(0) }}"
      pct:   "{{ states(pct_ent) }}"
      why:   "{{ states(why_ent) if why_ent else 'unknown' }}"
  - service: notify.mobile_app_YOUR_PHONE
    data:
      title: >-
        {{ '🪫 ' if volts < 5.0 else '🔋 ' }}{{ trap }} woke ({{ why }})
      message: >-
        Battery {{ '%.2f' | format(volts) }} V ({{ pct }}%)
        {%- if volts < 5.0 %} - getting low, plan a battery swap{% endif %}
      data:
        tag: "{{ dev }}-battery-report"
        group: local-kill
