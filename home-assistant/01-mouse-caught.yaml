# Local-Kill trap - Home Assistant automation (multi-trap). See README.md in this folder.
#
# Works for any number of traps. Edit ONLY the list marked  ▼ YOUR TRAPS ▼
# (one line per trap; entity IDs below assume you renamed the devices to
# "Kitchen trap" / "Garage trap" - use your own names).
# Replace notify.mobile_app_YOUR_PHONE with your notify service, then paste into
# Settings > Automations > Create > Edit in YAML.
#
# Mouse caught: fires when a trap's "Needs cleaning" goes off -> on.
# from: "off" stops it re-firing after an HA restart (unknown -> on).
alias: "Local-Kill: mouse caught"
mode: parallel
trigger:
  - platform: state
    entity_id:                                   # ▼ YOUR TRAPS ▼
      - binary_sensor.kitchen_trap_needs_cleaning
      - binary_sensor.garage_trap_needs_cleaning
    from: "off"
    to: "on"
variables:
  dev: "{{ device_id(trigger.entity_id) }}"
  ents: "{{ device_entities(device_id(trigger.entity_id)) }}"
  trap: "{{ device_attr(device_id(trigger.entity_id), 'name_by_user') or device_attr(device_id(trigger.entity_id), 'name') }}"
action:
  - delay: "00:00:03"          # let kill total / armed state arrive
  - variables:
      armed_ent: "{{ ents | select('match', 'switch\\..*_arm_trap_hv_live$') | first | default('') }}"
      kills_ent: "{{ ents | select('match', 'sensor\\..*_kill_total$') | first | default('') }}"
      armed: "{{ is_state(armed_ent, 'on') }}"
      total: "{{ states(kills_ent) | int(0) }}"
  - service: notify.mobile_app_YOUR_PHONE
    data:
      title: "🐭 {{ trap }} caught something"
      message: >-
        {% if armed %}HV fired.{% else %}Trap was DISARMED - HV did not fire, check it soon.{% endif %}
        Kill #{{ total }}. Empty it, then press "Mark cleaned" (or re-insert the batteries).
      data:
        tag: "{{ dev }}-catch"
        group: local-kill
        priority: high                 # Android heads-up
        ttl: 0
        push:
          interruption-level: time-sensitive   # iOS: breaks through Focus
