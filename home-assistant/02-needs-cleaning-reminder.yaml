# Local-Kill trap - Home Assistant automation (multi-trap). See README.md in this folder.
#
# Works for any number of traps. Edit ONLY the list marked  ▼ YOUR TRAPS ▼
# (one line per trap; entity IDs below assume you renamed the devices to
# "Kitchen trap" / "Garage trap" - use your own names).
# Replace notify.mobile_app_YOUR_PHONE with your notify service, then paste into
# Settings > Automations > Create > Edit in YAML.
#
# Still needs cleaning: reminder on every check-in until the trap is reset.
# Skips the check-in that IS the catch (01 already alerted for that one).
alias: "Local-Kill: still needs cleaning reminder"
mode: parallel
trigger:
  - platform: state
    entity_id:                                   # ▼ YOUR TRAPS ▼
      - binary_sensor.kitchen_trap_status
      - binary_sensor.garage_trap_status
    to: "on"
variables:
  dev: "{{ device_id(trigger.entity_id) }}"
  ents: "{{ device_entities(device_id(trigger.entity_id)) }}"
  trap: "{{ device_attr(device_id(trigger.entity_id), 'name_by_user') or device_attr(device_id(trigger.entity_id), 'name') }}"
  clean_ent: "{{ device_entities(device_id(trigger.entity_id)) | select('match', 'binary_sensor\\..*_needs_cleaning$') | first | default('') }}"
  why_ent: "{{ device_entities(device_id(trigger.entity_id)) | select('match', 'sensor\\..*_wake_reason$') | first | default('') }}"
condition:
  - condition: template
    value_template: "{{ is_state(clean_ent, 'on') and states(why_ent) != 'Catch' }}"
action:
  - delay: "00:00:05"
  - service: notify.mobile_app_YOUR_PHONE
    data:
      title: "🧹 {{ trap }} still needs emptying"
      message: >-
        Catch reported {{ relative_time(states[clean_ent].last_changed) }} ago
        and the trap hasn't been reset yet.
      data:
        tag: "{{ dev }}-catch"           # replaces the catch notification
        group: local-kill
