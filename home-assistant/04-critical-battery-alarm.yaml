# Local-Kill trap - Home Assistant automation. See README.md in this folder.
# Find/replace  local_kill_XXXXXX  with your trap's entity prefix and
# notify.mobile_app_YOUR_PHONE  with your notify service, then paste into
# Settings > Automations > Create > Edit in YAML.
#
# 4. Critical battery ALARM - rings even on silent / Do Not Disturb
#    Below ~4.8 V the HV may not charge properly and the trap may brown out.
alias: "Local-Kill: critical battery alarm"
mode: single
trigger:
  - platform: state
    entity_id: binary_sensor.local_kill_XXXXXX_status
    to: "on"
condition:
  - condition: numeric_state
    entity_id: sensor.local_kill_XXXXXX_battery_voltage
    below: 4.80
action:
  - service: notify.mobile_app_YOUR_PHONE
    data:
      title: "🚨 Trap battery CRITICAL"
      message: >-
        {{ states('sensor.local_kill_XXXXXX_battery_voltage') }} V - replace batteries now,
        the trap may stop killing or reporting.
      data:
        tag: local-kill-battery
        group: local-kill
        # Android: alarm stream rings through silent/DND
        ttl: 0
        priority: high
        channel: alarm_stream
        # iOS: critical alert (rings through silent/Focus)
        push:
          sound:
            name: default
            critical: 1
            volume: 1.0
